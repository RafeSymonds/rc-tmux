# Starter ~/.tmux.conf for someone coming from screen.
# install.sh only copies this if you don't already have a ~/.tmux.conf.

# Screen's prefix: Ctrl-a instead of tmux's Ctrl-b. Ctrl-a a sends a literal Ctrl-a.
unbind C-b
set -g prefix C-a
bind C-a last-window
bind a send-prefix

# Screen-like keys: C-a c new, C-a n/p next/prev, C-a " list, C-a d detach,
# C-a A rename, C-a k kill, C-a <digit> jump. Most of these are tmux defaults already.
bind '"' choose-window
bind A command-prompt -I "#W" "rename-window '%%'"
bind k confirm-before -p "kill window #W? (y/n)" kill-window

set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename off      # keep rct's window names
set -g allow-rename off
set -sg escape-time 10
set -g default-terminal "tmux-256color"
set -g status-right "#H  %a %H:%M"
